        .container {
    width: 90%;              /* Se adapta al ancho mobile */
    max-width: 420px;        /* Mantiene el tamaño en escritorio */
    background: #00662f;
    padding: 20px 25px 30px;
    border-radius: 25px;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 5;
    box-sizing: border-box;  /* Evita que el padding lo expanda */
}

        /* Tarjeta roja */
        .card-image {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .card-image img {
            width: 100%;
            display: block;
        }

        /* Formulario */
        label {
            font-weight: bold;
            color: white;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #b10000;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #8d0000;
        }

        /* Decoración animada */
        .icon {
            position: fixed;
            animation: float 12s linear infinite;
            opacity: 0.7;
            font-size: 25px;
            z-index: 1;
        }

        @keyframes float {
            0% {
                transform: translateY(110vh) rotate(0deg);
            }

            100% {
                transform: translateY(-120vh) rotate(360deg);
            }
        }


        /* Verde Navidad: fondo, texto blanco y estilo elegante */
        #respuesta {
            background-color: #0B6623;
            /* verde Navidad */
            color: #ffffff;
            /* texto blanco */
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            /* ajusta al contenido */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        /* Pequeña animación al pasar el cursor */
        #respuesta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body>

    <!-- Elementos decorativos flotantes -->
    <script>
        const figuras = ["⭐", "🌟", "✨", "🦋", "🟊"];
        for (let i = 0; i < 240; i++) {
            let el = document.createElement("span");
            el.classList.add("icon");
            el.innerHTML = figuras[Math.floor(Math.random() * figuras.length)];
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = (18 + Math.random() * 20) + "px";
            el.style.animationDuration = (6 + Math.random() * 10) + "s";
            document.body.appendChild(el);
        }
    </script>


    <!-- Tarjeta -->
    <div class="container">

        <div class="card-image">
            <img src="tarjeta.jpg" alt="Invitación">
        </div>
          <p style="margin-top: 20px; color:white; font-size: 50px; text-align: center;">CERRADO</p>

 <script>
    const url = "https://script.google.com/macros/s/AKfycbx5kOPbARcu0ovDo0wZ424Y4JXL1-OYo1C9Z-QLixiEaX_1oIR3BTJJyWj2yXon0PaW/exec";

    // Si ya fue enviado, bloquea el formulario
    if (localStorage.getItem("formEnviado")) {
        document.getElementById("miFormulario").style.display = "none";
        document.getElementById("respuesta").innerHTML =
            "✔️ Ya registraste tu información. ¡Gracias!";
    }

    document.getElementById("miFormulario").addEventListener("submit", function (e) {
        e.preventDefault();

        // Bloqueo inmediato para evitar doble clic
        document.getElementById("btnEnviar").disabled = true;

        const formData = new FormData(this);

        fetch(url, {
            method: "POST",
            body: formData
        })
        .then(res => res.text())
        .then(() => {
            localStorage.setItem("formEnviado", "true");

            document.getElementById("miFormulario").style.display = "none";
            document.getElementById("respuesta").innerHTML =
                "🎉 ¡Perfecto! Tus datos han sido registrados exitosamente. ¡Te esperamos!";
        })
        .catch(() => {
            document.getElementById("btnEnviar").disabled = false;
            document.getElementById("respuesta").innerHTML =
                "❌ Error enviando datos. Inténtalo nuevamente.";
        });
    });
</script>


</body>
